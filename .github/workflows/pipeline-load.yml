# ProFinder data pipeline: load an APPROVED release bundle into the app database.
# Step 1 (always): download the bundle, verify its checksums and approval.json, register it, and show the dry-run diff. Reads only.
# Step 2 (only with apply=true): runs in the GitHub Environment `pipeline-load`, which must have REQUIRED REVIEWERS. A person approves in the
#   GitHub UI after reading the dry-run diff; only then are rows written. The load is one transaction and aborts if a second plan is not empty.
# Secrets: Environment `pipeline-dry-run`: PIPELINE_DATABASE_URL, APP_DATABASE_URL (use a READ-ONLY database user).
#          Environment `pipeline-load`:    PIPELINE_DATABASE_URL, APP_DATABASE_URL (write access).  Take a database backup before the first apply.
name: pipeline-load

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Release id (full uuid from the bundle manifest)'
        required: true
        type: string
      source_run_id:
        description: 'A) id of a pipeline-run workflow run whose artifact `pipeline-output` holds the approved bundle'
        required: false
        default: ''
        type: string
      bundle_url:
        description: 'B) https URL of the bundle zip made with scripts/pack_release.py (leave A empty)'
        required: false
        default: ''
        type: string
      bundle_sha256:
        description: 'B) sha256 of that zip (printed by pack_release.py)'
        required: false
        default: ''
        type: string
      apply:
        description: 'false = dry-run only. true = ask the reviewers of the pipeline-load environment, then write.'
        required: true
        default: false
        type: boolean
      lock_policy:
        description: 'strict (default) or import-ok: see the owner guide before choosing'
        required: true
        default: strict
        type: choice
        options: [strict, import-ok]

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-load
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: pipeline-dry-run
    timeout-minutes: 30
    env:
      PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      RID: ${{ inputs.release_id }}
      LOCK: ${{ inputs.lock_policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install (no browser needed to load)
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Bundle from a workflow run (A)
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: pipeline-output
          path: pipeline/output
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle from a URL (B)
        if: inputs.source_run_id == '' && inputs.bundle_url != ''
        env:
          URL: ${{ inputs.bundle_url }}
          SHA: ${{ inputs.bundle_sha256 }}
        run: |
          test -n "$SHA" || { echo "bundle_sha256 is required with bundle_url"; exit 1; }
          curl -fsSL "$URL" -o /tmp/bundle.zip
          echo "$SHA  /tmp/bundle.zip" | sha256sum -c -
          mkdir -p pipeline/output/releases
          unzip -q /tmp/bundle.zip -d pipeline/output/releases

      - name: Verify, register, dry-run
        working-directory: pipeline
        run: |
          python -m profinder_pipeline init-db
          python -m profinder_pipeline release verify --release "$RID"
          python -m profinder_pipeline release import --release "$RID"
          python -m profinder_pipeline load --release "$RID" --lock-policy "$LOCK" | tee /tmp/dryrun.txt
          { echo '### Dry-run diff'; echo '```'; cat /tmp/dryrun.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the bundle for the apply job
        uses: actions/upload-artifact@v4
        with:
          name: approved-bundle
          retention-days: 3
          path: pipeline/output/releases

  apply:
    needs: dry-run
    if: inputs.apply
    runs-on: ubuntu-latest
    environment: pipeline-load          # configure REQUIRED REVIEWERS on this environment
    timeout-minutes: 30
    env:
      PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      RID: ${{ inputs.release_id }}
      LOCK: ${{ inputs.lock_policy }}
      CONFIRM_LOAD: ${{ inputs.release_id }}
      ALLOW_PRODUCTION_LOAD: ${{ inputs.release_id }}   # the reviewers' approval is the owner's decision to write to a host named prod*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - working-directory: pipeline
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: approved-bundle
          path: pipeline/output/releases
      - name: Verify, register, apply
        working-directory: pipeline
        run: |
          python -m profinder_pipeline release verify --release "$RID"
          python -m profinder_pipeline release import --release "$RID"
          python -m profinder_pipeline load --release "$RID" --lock-policy "$LOCK" --apply | tee /tmp/apply.txt
          python -m profinder_pipeline load --release "$RID" --lock-policy "$LOCK" | tee /tmp/after.txt
          { echo '### Applied'; echo '```'; cat /tmp/apply.txt; echo '--- re-check (must show no operations) ---'; cat /tmp/after.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
