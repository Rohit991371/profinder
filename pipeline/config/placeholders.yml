# Template values the app shows today that are NOT real data (doc 01 section 8.5).
# `enrich` treats a matching value as empty and may overwrite it; any other non-empty value is never overwritten (-> proposal).
# kinds: equals | contains | starts_with | regex | cjk_only   (all case-insensitive; cjk_only needs no value)
# Entity = Prisma model name, field = Prisma column name.
rules:
  - {entity: University,  field: officialUrl,       kind: contains,    value: "campuschina.org", note: "CampusChina placeholder (89 of 104 universities)"}
  - {entity: Professor,   field: researchInterests, kind: equals,      value: "computer science", note: "keyword-only filler"}
  - {entity: Professor,   field: researchInterests, kind: regex,       value: '^listed on the official\b.*faculty directory', note: "boilerplate, e.g. Fudan"}
  - {entity: Professor,   field: researchInterests, kind: regex,       value: '^\s*(computer science\s*[;,，；]?\s*)+$', note: "repeated keyword-only filler, e.g. 'computer science; computer science'"}
  - {entity: Professor,   field: position,          kind: equals,      value: "Faculty", note: "generic title from the old importer"}
  - {entity: Professor,   field: position,          kind: cjk_only,    note: "Chinese-only position; should be normalised English"}
  - {entity: Program,     field: deadline,          kind: starts_with, value: "Not confirmed", note: "312 template rows"}
  - {entity: Program,     field: teachingLang,      kind: regex,       value: '^English or Chinese\s*[-\u2013\u2014]\s*confirm', note: "template wording"}
  - {entity: Scholarship, field: deadline,          kind: starts_with, value: "Not confirmed"}
  - {entity: Scholarship, field: deadline,          kind: starts_with, value: "Check campus china"}
  # Decision for Iteration 5 (not active): 8 Program rows say "March 31 (typical ...)". D7 forbids "typical" dates, so they
  # behave like placeholders in practice. Uncomment after the owner agrees they may be replaced:
  # - {entity: Program, field: deadline, kind: regex, value: '\(typical', note: "typical date, not an official one"}
