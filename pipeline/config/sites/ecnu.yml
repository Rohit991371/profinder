# Site config for the ECNU CS faculty list (trial C). Name, position and email are on the list page. The list mixes several schools
# (计算机科学与技术学院, 软件工程学院, 密码学院, ...), so the school comes from each person's own profile page (faculty.ecnu.edu.cn
# template: `部门`), and research directions from its 研究方向 section. Checked against two real profile pages (2026-10-23).
university: East China Normal University
list_url: https://cs.ecnu.edu.cn/jzgml/list.htm
school_en: null          # not used: department_is_school (see profile) - the list covers several schools
school_zh: null
render: static
personal_url_patterns:
  - '^https://faculty\.ecnu\.edu\.cn/'
  - '/_redirect\?'
list:
  item: "div.team li[name][data-name]"
  min_items: 50
  fields:
    name:          {css: ".li-text p a"}
    profile_href:  {css: ".li-text p a", attr: href}
    position:      {label: '职称[：:]\s*([^$\n]*)'}
    emails:        {emails: true}
    group:         {attr_of_item: "data-name"}
profile:
  required: false
  department_is_school: true
  fields:
    name:             {css: "h1.news_title"}
    position:         {css: ".news_meta .tip2"}
    department:       {css: ".news_meta .tip1", index: 1}
    emails:           {emails: true, css: "div.post"}
    personal_website: {labelled_link: "个人主页"}
    interests:
      section_items:
        item: "div.post"
        title: ".tt .title"
        body: ".con"
        line_css: "p"
        strip_prefix: '^(目前)?研究方向\s*[：:]\s*'
        titles: ["研究方向", "研究领域"]
        max_lines: 8
