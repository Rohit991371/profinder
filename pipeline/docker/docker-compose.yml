# Local Postgres for the ProFinder data pipeline (test/dev only).
# Port 55432 on localhost (5432 and 5433 are used by other projects).
# Run from this folder:  docker compose --env-file ../.env up -d
name: profinder_pipeline

services:
  db:
    image: postgres:16
    container_name: profinder-pipeline-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-pipeline}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in pipeline/.env}
      POSTGRES_DB: ${PG_DB:-profinder_pipeline}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-pipeline} -d ${PG_DB:-profinder_pipeline}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
